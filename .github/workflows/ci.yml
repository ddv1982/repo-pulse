name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:types
      - run: npm run lint
      - run: npm run build:web
      # The build above serves every suite, so the per-suite pre-scripts that rebuild it are skipped.
      - run: npm test --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui --ignore-scripts
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-linux
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  checks-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:types
      - run: npm run lint
      - run: npm run build:web
      - run: npm test --ignore-scripts
      - run: npx playwright install chromium
      - run: npm run test:dom --ignore-scripts
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-windows
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

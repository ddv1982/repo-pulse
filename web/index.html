<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A local, read-only catch-up view for watched Azure DevOps repositories." />
    <title>Repo Pulse</title>
    <link rel="icon" href="/web/favicon.svg" type="image/svg+xml" />
    <script src="/web/theme.js"></script>
    <link rel="stylesheet" href="/web/app.css" />
    <script type="module" src="/src/web.js"></script>
  </head>
  <body>
    <div class="wrap">
      <header class="app" id="header"></header>
      <div id="demo"></div>
      <div id="notice" aria-live="polite"></div>
      <main id="page"><div class="card loading">Loading your local watch list…</div></main>
      <p class="help" style="margin-top: 16px">
        Read-only Azure activity · local history · 2–5 minute adaptive checks · no monitoring while the app is stopped
      </p>
    </div>
    <div id="live" class="sr" aria-live="polite"></div>
    <div id="sync-live" class="sr" role="status" aria-live="polite"></div>
    <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-subject confirm-description">
      <div class="dbody">
        <h2 id="confirm-title"></h2>
        <code id="confirm-subject" class="mono" hidden></code>
        <p id="confirm-description"></p>
      </div>
      <div class="dfoot">
        <button type="button" class="btn" data-action="cancel-dialog">Cancel</button
        ><button type="button" class="btn primary" id="confirm-button" data-action="confirm-dialog">Confirm</button>
      </div>
    </dialog>
    <dialog id="history-dialog" aria-labelledby="history-title" aria-describedby="history-help">
      <form>
        <div class="dbody">
          <h2 id="history-title">Sync older activity</h2>
          <p class="history-repository" id="history-repository"></p>
          <fieldset class="history-ranges">
            <legend>Look back</legend>
            <label><input type="radio" name="history-range" value="30" checked autofocus /> 30 days</label>
            <label><input type="radio" name="history-range" value="90" /> 90 days</label>
            <label><input type="radio" name="history-range" value="all" /> All available since 2010</label>
          </fieldset>
          <p class="help" id="history-help">
            Syncs what Azure still has from before monitoring began. Find the results under Imported history in All activity.
          </p>
          <p class="status-text crit" role="alert" hidden></p>
        </div>
        <div class="dfoot">
          <button type="button" class="btn" data-history-cancel>Cancel</button>
          <button type="submit" class="btn primary">Start sync</button>
        </div>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
